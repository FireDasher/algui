[package]
name = "algui"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", optional = true }
glam = "0.33.2"
pollster = { version = "1.0.1", optional = true }
wgpu = { version = "30.0.0", optional = true }
winit = { version = "0.30.13", optional = true }

[features]
default = ["platform"]
# Framework for creating apps using algui
platform = ["dep:wgpu", "dep:winit", "dep:pollster", "bytemuck"]
bytemuck = ["dep:bytemuck", "glam/bytemuck"]
